name: Generate Article Speech

on:
  schedule:
    - cron: '0 7 * * 1-5'
      timezone: 'Asia/Tokyo'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Generate speech from articles
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/article_to_speech.py
      - name: Upload audio
        uses: actions/upload-artifact@v3
        with:
          name: vlog-audio
          path: vlog/*.mp3
          if-no-files-found: ignore
